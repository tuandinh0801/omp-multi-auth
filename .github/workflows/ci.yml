name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test

      - uses: oven-sh/setup-bun@v2
      - name: Install omp
        run: |
          bun install -g @oh-my-pi/pi-coding-agent@latest
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Run host tests
        run: |
          omp --version
          node tests/opencode-go-provider-check.mjs
          node tests/opencode-go-quota-check.mjs
          node tests/sub-usage-check.mjs
      - name: Run base transport host test
        run: node tests/base-transport-check.mjs
